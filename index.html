<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBSERVATIONS — RYUSEI ETO</title>
<meta name="description" content="衛藤隆世のシミュレーション作品集">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="splash" class="splash">
  <div class="splash-inner"><span class="splash-text">OBSERVATIONS</span></div>
</div>

<div class="tap-crosshair" id="tapCrosshair"></div>

<main>
  <header class="page-header">
    <div class="page-header-left">
      <span>LOG</span>
      <span>RYUSEI ETO</span>
    </div>
  </header>

  <div class="map-frame" id="mapFrame">
    <div class="map-layer" id="mapLayer">
      <div class="map-dots" id="mapDots"></div>
      <div class="gaze-line" id="gazeLine" hidden></div>
    </div>
    <div class="map-coords" id="mapCoords">
      <span class="map-coords-last" id="mapCoordsLast"></span>
      <span class="map-coords-self" id="mapCoordsSelf">--. --.</span>
    </div>
  </div>
</main>

<footer class="site-footer">
  <a class="site-footer-dot" href="https://instagram.com/sightseeingcomputer" target="_blank" rel="noopener" aria-label="@sightseeingcomputer"></a>
  <div class="site-status" id="siteStatus">
    <span class="site-status-weather" id="statusWeather"></span>
    <span class="site-status-country" id="statusCountry"></span>
    <span class="site-status-clock" id="statusClock"></span>
  </div>
</footer>

<div id="viewer" class="viewer" aria-hidden="true">
  <div class="viewer-inner">
    <div class="viewer-image-wrap">
      <img id="viewer-image" src="" alt="">
    </div>
    <div class="viewer-meta">
      <span class="viewer-index" id="viewer-index"></span>
      <h2 id="viewer-title"></h2>
      <dl class="viewer-fields">
        <dt>OBSERVED</dt><dd id="viewer-observed"></dd>
        <dt>GENERATED</dt><dd id="viewer-generated"></dd>
        <dt>ADDRESS</dt><dd id="viewer-address"></dd>
        <dt id="viewer-distance-label">DISTANCE</dt><dd id="viewer-distance"></dd>
        <dt id="viewer-views-label">YOU VIEWED</dt><dd id="viewer-views"></dd>
      </dl>
      <p id="viewer-note"></p>
    </div>
  </div>
</div>

<script src="works.js"></script>
<script src="script.js"></script>
</body>
</html>
